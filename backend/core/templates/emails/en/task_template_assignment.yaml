subject: "Auditcore: You have been assigned to '${task_name}'"
body: |
  Hello,

  You have been assigned to the following task:

  - Name: ${task_name}
  - Description: ${task_description}
  - Reference ID: ${task_ref_id}
  - Task Date: ${task_date}
  - Recurrent: ${is_recurrent}
  - Domain: ${folder_name}

  Log in to your Auditcore portal to view and manage this task: [Go to Auditcore](${ciso_assistant_url}/task-templates/${task_id})

  Thank you.
