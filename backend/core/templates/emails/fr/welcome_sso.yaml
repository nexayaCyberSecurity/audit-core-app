subject: "Bienvenue sur Auditcore !"
body: |
  <img src="https://auditcore.io/ciso-assistant.png" alt="Auditcore" width="200">

  ## Bienvenue sur Auditcore !

  **Votre plateforme de gestion GRC tout-en-un**

  Un accès à Auditcore vous a été accordé. Pour commencer, connectez-vous via le lien ci-dessous en utilisant l'authentification SSO :

  [Se connecter à Auditcore](${ciso_assistant_url})

  En cas de problème avec le lien, copiez et collez l'URL suivante dans votre navigateur :
  ${ciso_assistant_url}

  Si vous, ou votre organisation, n'avez pas fait cette demande, vous pouvez simplement ignorer cet email.

  En savoir plus sur Auditcore [ici](https://auditcore.io/).

  Cordialement,
  L'équipe Auditcore
