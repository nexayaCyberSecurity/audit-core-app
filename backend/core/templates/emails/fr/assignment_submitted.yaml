subject: "Auditcore : Affectation soumise pour '${assessment_name}'"
body: |
  Bonjour,

  Une affectation a été soumise pour revue sur l'audit suivant :

  - Audit : ${assessment_name}
  - Soumis par : ${actor_names}
  - Exigences évaluées : ${requirement_count}

  Veuillez vous connecter à votre portail Auditcore pour examiner la soumission : [Accéder à Auditcore](${ciso_assistant_url})

  Merci.
